<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Dynamic Circular Favicon Slot -->
    <link id="dynamic-favicon" rel="icon" href="%PUBLIC_URL%/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F172A" />
    <meta
      name="description"
      content="JADWA - Financial Feasibility & Management Platform"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Browser Tab Title -->
    <title>JADWA | Financial Platform</title>

    <!-- Script to render square logo.png into a circle frame for browser tab -->
    <script>
      (function makeFaviconCircle() {
        const img = new Image();
        img.src = '%PUBLIC_URL%/logo.png';
        img.crossOrigin = 'Anonymous';
        img.onload = function () {
          const canvas = document.createElement('canvas');
          const size = Math.max(img.width, img.height);
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');

          // Draw circular clip path
          ctx.beginPath();
          ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
          ctx.closePath();
          ctx.clip();

          // Draw dark background & logo image inside circle
          ctx.fillStyle = '#0F172A';
          ctx.fillRect(0, 0, size, size);
          ctx.drawImage(img, 0, 0, size, size);

          // Optional: Blue border stroke
          ctx.lineWidth = size * 0.05;
          ctx.strokeStyle = '#2563EB';
          ctx.stroke();

          // Replace favicon link with circular canvas data
          const favicon = document.getElementById('dynamic-favicon');
          if (favicon) {
            favicon.href = canvas.toDataURL('image/png');
          }
        };
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
